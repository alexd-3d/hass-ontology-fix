"Internal query-only schema. This endpoint is never exposed directly to browsers."
schema {
  query: Query
}

type Query {
  initialGraph(limit: Int = 100, after: String): GraphSlice!
  expandNode(id: ID!, nodeLimit: Int = 25, edgeLimit: Int = 50, after: String): GraphSlice!
  searchGraph(term: String!, limit: Int = 50): GraphSearchResult!
  graphElement(id: ID!): GraphElementResult
  graphHealth: GraphHealth!
  labCapability: LabCapability!
}

type GraphSlice {
  nodes: [GraphNode!]!
  relationships: [GraphRelationship!]!
  pageInfo: GraphPageInfo!
  revision: Int!
}

type GraphSearchResult {
  matches: [GraphSearchMatch!]!
  truncated: Boolean!
  revision: Int!
}

type GraphElementResult {
  node: GraphNode
  relationship: GraphRelationship
  directConnections: GraphSlice!
}

type GraphNode {
  id: ID!
  haId: String!
  type: GraphNodeType!
  label: String!
  icon: String
  state: String
  unavailable: Boolean!
  findingSeverity: FindingSeverity
  properties: [GraphProperty!]!
}

type GraphRelationship {
  id: ID!
  type: String!
  source: ID!
  target: ID!
  directed: Boolean!
  sourceClass: SourceClass
  properties: [GraphProperty!]!
}

type GraphProperty {
  name: String!
  value: GraphScalar
  displayValue: String!
}

type GraphSearchMatch {
  id: ID!
  haId: String!
  type: GraphNodeType!
  label: String!
  icon: String
}

type GraphPageInfo {
  truncated: Boolean!
  nextCursor: String
}

type GraphHealth {
  status: GraphHealthStatus!
  revision: Int!
  latencyMs: Int!
}

scalar GraphScalar

enum GraphNodeType {
  AREA
  DEVICE
  ENTITY
  AUTOMATION
  SCENE
  SCRIPT
  DASHBOARD
  DASHBOARD_CARD
  SEMANTIC_TYPE
  VALIDATION_FINDING
  # ON-010: per-entity semantic classification asset nodes
  # (custom_components/ontology/semantic_classifier.py `<entity_id>::<Label>`
  # nodes). Previously unmapped, so every classified entity's asset node fell
  # back to OTHER in the Explorer even though the classifier tags exactly
  # these 8 labels (const.py LABEL_* constants).
  BATTERY_POWERED_DEVICE
  ENERGY_ASSET
  OCCUPANCY_SENSOR
  CLIMATE_DEVICE
  NETWORK_DEVICE
  SECURITY_DEVICE
  VEHICLE
  GAS_CYLINDER
  # ON-011: entities tied to Alex's Reolink cameras/NVR, matched by device
  # manufacturer rather than domain/device_class/keyword (see
  # semantic_classifier.py's `manufacturers` rule field). Replaces the
  # misleading VEHICLE tag Reolink's AI "vehicle detected" binary_sensors
  # used to get.
  CAMERA
  OTHER
}

enum FindingSeverity {
  INFO
  WARNING
  ERROR
  CRITICAL
}

enum SourceClass {
  HOME_ASSISTANT
  GENERATED
  INFERRED
  USER
}

enum GraphHealthStatus {
  HEALTHY
  DEGRADED
  UNAVAILABLE
}

type LabCapability {
  available: Boolean!
  reason: LabCapabilityReason!
  ingressPath: String
  checkedAt: String!
}

enum LabCapabilityReason {
  READY
  NOT_ADDON_BACKEND
  TRANSPORT_UNAVAILABLE
  LAB_UNHEALTHY
  ENTERPRISE_REQUIRED
  READONLY_USER_MISSING
  WRITE_PROBE_SUCCEEDED
}
